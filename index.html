:root{--bg:#f6f5f1;--ink:#16161a;--gris:#6f6e77;--trait:#d9d6cc;--lilas:#c9bdf5;--orange:#ff7a2f;--or:#ff7a2f;--peche:#ffd9b8;--ciel:#bfe3ff;--menthe:#cfe6e4;--rose:#ffd3e4;--vert:#1f9d6b;--grenat:#e5484d;--creme:#f1efe9;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:max(18px,env(safe-area-inset-left,0px));--sr:max(18px,env(safe-area-inset-right,0px));
--f:"Satoshi",system-ui,-apple-system,"Segoe UI",sans-serif;--f-titre:"Cabinet Grotesk","Satoshi",system-ui,sans-serif;--f-plume:"Zodiak",Georgia,serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#dfe6e6}
body{font:400 15px/1.45 var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

.app{position:relative;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
.vue{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:calc(var(--st) + 16px) var(--sr) calc(var(--sb) + 118px) var(--sl);background:linear-gradient(180deg,#bcd9ee 0,#e9eee9 280px,var(--bg) 560px) local}
.vue.on{display:block}

.dock{position:absolute;left:50%;bottom:calc(var(--sb) + 12px);transform:translateX(-50%);z-index:900;display:flex;align-items:center;background:var(--ink);border-radius:34px;padding:7px;box-shadow:0 14px 34px rgba(22,22,26,.28)}
.dock button{width:60px;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#a9a8b3;transition:background .2s,color .2s}
.dock button span{font-size:10px;font-weight:500;letter-spacing:.01em}
.dock button.on{background:#fff;color:var(--ink)}
.dock button.centre{width:62px;height:62px;border-radius:50%;background:var(--orange);color:var(--ink);margin:-22px 4px 0;box-shadow:0 0 0 5px var(--bg),0 10px 22px rgba(255,122,47,.45)}
.dock button.centre span{display:none}.dock button.centre .ic{width:26px;height:26px}
.dock button.centre.on{background:var(--orange);box-shadow:0 0 0 5px var(--ink),0 0 0 8px var(--orange)}

.haut{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.salut{font-size:14px;font-weight:500;color:#3c4a5a;margin-bottom:4px}
h1{font-size:42px;line-height:1;font-weight:700;letter-spacing:-.035em}
h1 i,h2 i,.fin i,h3 i{font-family:var(--f-plume);font-style:italic;font-weight:400;letter-spacing:-.01em}
.rond{width:50px;height:50px;flex:0 0 auto;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(22,22,26,.08)}
.titre{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px}
.titre h2{font-size:25px;font-weight:700;letter-spacing:-.03em}.titre small,.titre a{font-size:13px;color:var(--gris);font-weight:500}
.bloc>h2{font-size:34px;line-height:1.02;font-weight:700;letter-spacing:-.035em;margin-bottom:8px}
.sur{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--gris);margin-bottom:6px}
.chapo{font-size:16px;color:#3f3e46;margin-bottom:18px}.petit{font-size:13px;color:var(--gris)}

.heros{position:relative;overflow:hidden;background:var(--orange);border-radius:36px;padding:22px;min-height:214px;display:flex;flex-direction:column;justify-content:space-between}
.h-txt{max-width:64%;position:relative;z-index:1}
.h-sur{font-size:13px;font-weight:600;opacity:.8}
.h-gros{font-size:46px;line-height:1;font-weight:800;letter-spacing:-.04em;margin:6px 0 8px}
.h-petit{font-size:13.5px;line-height:1.35;font-weight:500}
.h-img{position:absolute;right:-34px;bottom:-34px;width:178px;height:178px;border-radius:50%;overflow:hidden;background:#ffb27f;border:6px solid rgba(255,255,255,.35)}
.h-img img{width:100%;height:100%;object-fit:cover}
.pil{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:99px;padding:12px 18px;font-size:14px;font-weight:600;white-space:nowrap}
.heros .pil{align-self:flex-start;margin-top:16px;position:relative;z-index:1}

.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * var(--sr)) 0 calc(-1 * var(--sl));padding:2px var(--sr) 6px var(--sl);scroll-padding-left:var(--sl);scrollbar-width:none}
.rail::-webkit-scrollbar,.puces::-webkit-scrollbar{display:none}
.rail>*{flex:0 0 auto;scroll-snap-align:start}

.billet{flex-basis:86%;background:var(--lilas);border-radius:30px;padding:18px;position:relative}
.billet.nuit{background:var(--ink);color:#fff}
.b-tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;font-weight:600}
.b-tete span{background:rgba(255,255,255,.55);border-radius:99px;padding:5px 11px;font-size:12px}
.nuit .b-tete span{background:rgba(255,255,255,.14)}
.vol{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vol+.vol{margin-top:12px}
.vol .code{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1}.vol .h{font-size:15px;font-weight:600;margin-top:2px}
.vol .n{font-size:11.5px;opacity:.7;line-height:1.25;margin-top:2px}.vol .d{text-align:right}
.mil{text-align:center;font-size:11px;font-weight:600;opacity:.75;display:flex;flex-direction:column;align-items:center;gap:2px}
.b-coupe{position:relative;border-top:2px dashed rgba(22,22,26,.25);margin:16px -18px 14px}
.nuit .b-coupe{border-color:rgba(255,255,255,.25)}
.b-coupe::before,.b-coupe::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:#eef0eb}
.b-coupe::before{left:-11px}.b-coupe::after{right:-11px}
.b-pied{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:500}
.codebarre{width:92px;height:34px;flex:0 0 auto;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 4px,currentColor 4px 7px,transparent 7px 9px,currentColor 9px 10px,transparent 10px 13px);opacity:.8;border-radius:3px}

.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tuile{border-radius:28px;padding:16px;min-height:138px;display:flex;flex-direction:column;justify-content:space-between;background:#fff}
.tuile .t-ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
.tuile b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.15}.tuile span{font-size:12.5px;color:#3f3e46;line-height:1.3;display:block;margin-top:3px}
.ciel{background:var(--ciel)}.peche{background:var(--peche)}.menthe{background:var(--menthe)}.rose{background:var(--rose)}.lilas{background:var(--lilas)}
.ligne{display:flex;align-items:center;gap:14px;background:var(--menthe);border-radius:28px;padding:14px 16px;margin-top:12px;width:100%}
.ligne .l-ic{width:46px;height:46px;flex:0 0 auto;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.ligne b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}.ligne span{font-size:12.5px;color:#3f3e46}
.ligne>.ic{margin-left:auto}
.resa{flex-basis:78%;background:#fff;border-radius:28px;padding:16px}
.resa h3{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}.resa p{font-size:13px;color:#3f3e46;margin-bottom:10px}
.vers{display:flex;flex-wrap:wrap;gap:6px}
.ver{display:inline-flex;align-items:center;gap:6px;background:var(--creme);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600}
.ver i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.coeur{width:148px;text-align:left}
.c-ph{position:relative;aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--p,var(--creme));margin-bottom:8px}
.coeur b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2}.coeur small{font-size:12px;color:var(--gris)}
.a-jour{background:var(--ciel);border-radius:30px;padding:18px}
.a-jour h3{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:10px}

/* ---------- Typo (Fontshare : Cabinet Grotesk, Satoshi, Zodiak) ---------- */
h1,h2,h3,h4,.h-gros,.code,.tuile b,.coeur b,.duo b,.urg b,.chiffres b,.jour b,.m-t,.avis b,.nt{font-family:var(--f-titre);font-weight:800}
h1{font-size:44px;letter-spacing:-.025em}h2{letter-spacing:-.02em}h3,h4{letter-spacing:-.01em}
.h-gros{font-size:52px;letter-spacing:-.03em}
h1 i,h2 i,h3 i,.fin i{font-family:var(--f-plume);font-weight:400;letter-spacing:-.02em;font-size:1.02em}
.vol .h{font-weight:700}

/* ---------- Safe zones ---------- */
/* bandeau sous la barre d'état (encoche / Dynamic Island) : le contenu ne passe jamais dessous */
.app::before{content:"";position:absolute;top:0;left:0;right:0;height:var(--st);z-index:950;background:rgba(188,217,238,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:none}
.jours{top:-16px;padding:16px var(--sr) 10px var(--sl);margin:-16px calc(-1 * var(--sr)) 6px calc(-1 * var(--sl));background:rgba(246,245,241,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dock{max-width:calc(100% - var(--sl) - var(--sr));bottom:max(12px,calc(var(--sb) + 6px))}
@media (max-width:359px){.dock button{width:50px}.dock button span{font-size:9px}.dock button.centre{width:56px;height:56px;margin:-20px 2px 0}}
#apercu{left:var(--sl);right:var(--sr)}
#feuille .x{top:14px}
@media (orientation:landscape) and (max-height:500px){.vue{padding-bottom:calc(var(--sb) + 96px)}#feuille{max-height:calc(100dvh - var(--st) - 8px)}}
.haut h1{font-size:clamp(32px,10.4vw,44px);white-space:nowrap}
.vue{scrollbar-width:none}.vue::-webkit-scrollbar{display:none}
.dock button{width:62px}.dock button span{letter-spacing:-.015em;white-space:nowrap}
@media (max-width:359px){.dock button{width:50px}}
.rang{flex-wrap:wrap}.rang>.btn{flex:1 1 auto;padding:0 14px}

/* ---------- Ma position ---------- */
.moi{position:absolute;right:var(--sr);bottom:calc(var(--sb) + 116px);z-index:550;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);box-shadow:0 6px 18px rgba(22,22,26,.2)}
.moi .ic{width:22px;height:22px}
.moi.on{color:#2f7bff}.moi.on .ic{fill:#2f7bff}
.moi.cherche .ic{animation:clign 1s ease-in-out infinite}
#apercu.on+.moi{display:none}
.moi-pt{display:block;width:20px;height:20px;border-radius:50%;background:#2f7bff;border:3px solid #fff;animation:halo 2s ease-out infinite}
.ap-moi{display:flex;align-items:center;gap:6px;color:#2f7bff;font-weight:600}.ap-moi:empty{display:none}.ap-moi .ic{width:14px;height:14px;fill:#2f7bff}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(47,123,255,.5),0 1px 4px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 18px rgba(47,123,255,0),0 1px 4px rgba(0,0,0,.3)}}
@keyframes clign{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.moi-pt,.moi.cherche .ic{animation:none}}
.conv-a{margin-top:14px}.conv-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.conv-t b{font-family:var(--f-titre);font-size:19px;font-weight:800}.conv-t small{color:var(--gris);font-size:12.5px}

/* ---------- Aperçu carte avec photo ---------- */
.ap-ph{display:block;position:relative;width:calc(100% + 12px);height:138px;margin:-6px -6px 12px;border-radius:22px;overflow:hidden;background:var(--p,var(--creme))}

#apercu.avec-ph h3{margin-right:0}
/* ---------- Spécialités ---------- */
.spe{width:148px;flex:0 0 auto;text-align:left;scroll-snap-align:start}
.spe .c-ph{aspect-ratio:4/5}
.spe .c-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spe b{display:block;font-family:var(--f-titre);font-size:15px;font-weight:800;line-height:1.15}
.spe small{display:block;font-size:12.5px;color:var(--gris);margin-top:2px}
.saison{position:absolute;left:8px;top:8px;background:var(--orange);color:var(--ink);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700}
.spe-note{font-size:13px;color:var(--gris);margin:10px 2px 0;padding-left:12px;border-left:3px solid var(--peche)}
.mini>.ic{color:var(--gris);margin-right:8px}
.c-ph{display:block;width:100%}.coeur{flex:0 0 auto}

/* ---------- Comptes à deux ---------- */
.retour{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--gris);margin-bottom:10px;padding:6px 0}
.retour .ic{width:18px;height:18px}
.cpt-a{background:var(--peche)}.cpt-a #a-cpt{flex:1;min-width:0}.cpt-a b{display:block;font-family:var(--f-titre);font-size:17px;font-weight:800;line-height:1.2}.cpt-a span{display:block;font-size:13px;color:#5a4a3c}
.champ{width:100%;border:0;background:var(--creme);border-radius:18px;padding:14px 16px;font-size:16px;margin:4px 0 14px}
.solde{background:var(--lilas);border-radius:32px;padding:22px;margin-bottom:12px}.solde.ok{background:var(--menthe)}
.s-gros{font-family:var(--f-titre);font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0}
.solde p{font-weight:600;font-size:16px;margin-bottom:4px}.solde .pil{margin-top:12px}
.duo-p{display:grid;grid-template-columns:1fr 1fr;gap:10px}.duo-p>div{background:#fff;border-radius:24px;padding:14px 16px}
.duo-p span{display:block;font-size:12.5px;color:var(--gris)}.duo-p b{font-family:var(--f-titre);font-size:22px;font-weight:800}
.cpt-etat{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--gris);min-height:28px}
.cpt-etat button{display:grid;place-items:center;width:30px;height:30px;border-radius:50%}.cpt-etat .ic{width:16px;height:16px}
.cats{padding:14px 16px}.cat-l{display:flex;align-items:center;gap:12px;padding:6px 0}.cat-l>div{flex:1;min-width:0}
.cat-ic{width:40px;height:40px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--c)}.cat-ic .ic{width:19px;height:19px}
.cat-t{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.cat-b{height:6px;border-radius:99px;background:var(--creme);margin-top:6px;overflow:hidden}.cat-b i{display:block;height:100%;border-radius:99px}
.cpt-l{background:#fff;border-radius:26px;padding:4px 12px;margin-bottom:8px}
.cpt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;text-align:left}.cpt+.cpt{border-top:1px solid var(--creme)}
.cpt>div:nth-child(2){flex:1;min-width:0}.cpt b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cpt small{display:block;font-size:12.5px;color:var(--gris)}
.cpt-m{text-align:right;flex:0 0 auto}.cpt-m b{font-family:var(--f-titre);font-weight:800;font-size:16px}
.mt-l{display:flex;align-items:center;gap:10px;margin-top:6px}
#cpt-mt{flex:1;min-width:0;border:0;background:var(--creme);border-radius:22px;padding:14px 18px;font-family:var(--f-titre);font-size:34px;font-weight:800}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}.pills label{position:relative}
.pills input{position:absolute;opacity:0;width:1px;height:1px}
.pills span{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:99px;background:var(--creme);font-weight:600;font-size:14px;cursor:pointer}
.pills span i{width:9px;height:9px;border-radius:50%}
.pills input:checked+span{background:var(--ink);color:#fff}.pills input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.mt-l .pills{margin:0;flex-wrap:nowrap}
.lien{text-decoration:underline;font-weight:600;color:var(--ink)}

/* ---------- Billets : infos + cartes d'embarquement ---------- */
.billet{cursor:pointer}
.b-places{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.b-places>div{background:rgba(255,255,255,.55);border-radius:16px;padding:8px 10px;font-size:12px;line-height:1.35}
.billet.nuit .b-places>div{background:rgba(255,255,255,.1)}
.b-places b{display:block;font-family:var(--f-titre);font-size:13px;font-weight:800}.b-places span{display:block}
.b-pied u{text-decoration:none;font-weight:700;font-size:12px;opacity:.75}
#embarq{position:fixed;inset:0;z-index:2100;display:none;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);padding:calc(var(--st) + 18px) 0 calc(var(--sb) + 24px)}
#embarq.on{display:block}
#embarq .x{top:calc(var(--st) + 14px);right:var(--sr)}
.emb-h{padding:0 var(--sr) 0 var(--sl);margin:4px 60px 16px 0}
.emb-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--sr) 8px var(--sl);scroll-padding:0 var(--sl);scrollbar-width:none}
.emb-rail::-webkit-scrollbar{display:none}
.emb{flex:0 0 calc(100% - 28px);max-width:440px;scroll-snap-align:center;background:#fff;border-radius:32px;padding:20px;box-shadow:0 10px 30px rgba(22,22,26,.08)}
.emb-t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.06em}
.emb-v{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.emb-v b{display:block;font-family:var(--f-titre);font-size:40px;font-weight:800;line-height:1}.emb-v small{font-size:13px;color:var(--gris)}
.emb-v>div:last-child{text-align:right}.emb-v .ic{width:26px;height:26px;color:var(--orange)}
.emb-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--creme);border-radius:20px;padding:12px}
.emb-g small{display:block;font-size:11px;color:var(--gris);font-weight:600}.emb-g b{font-family:var(--f-titre);font-size:18px;font-weight:800}
.emb-qr{margin:16px auto 6px;max-width:300px;background:#fff;border-radius:16px}.emb-qr svg{display:block;width:100%;height:auto}
.emb-n{text-align:center;font-size:12.5px;color:var(--gris)}
.emb-note,#embarq .carte-b{margin:12px var(--sr) 0 var(--sl)}

/* ---------- Budget ---------- */
.budget{background:var(--orange);border-radius:32px;padding:22px;margin-bottom:12px}
.budget p{font-weight:600;font-size:15px}
.cat-t small{font-family:var(--f);font-weight:500;color:var(--gris);font-size:12px;margin-left:4px}
.jours-b{display:flex;align-items:flex-end;gap:8px;padding:16px 14px 12px}
.jb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.jb-c{width:100%;max-width:34px;height:110px;background:var(--creme);border-radius:12px;display:flex;align-items:flex-end;overflow:hidden}
.jb-c i{display:block;width:100%;background:var(--ink);border-radius:12px;min-height:0}
.jb-m{font-size:11px;font-weight:700;white-space:nowrap;min-height:14px}.jb small{font-size:11.5px;color:var(--gris);font-weight:600}
.entre-nous{background:#fff;border-radius:24px;padding:14px 16px;margin-top:16px;font-size:14px}
.entre-nous .lien{margin-top:6px;font-size:13.5px}

/* ---------- Réservations ---------- */
.resa-n{display:flex;gap:14px;background:var(--ink);color:#fff;border-radius:30px;padding:18px;margin-bottom:12px}
.rn-h{flex:0 0 auto;text-align:center;background:var(--orange);color:var(--ink);border-radius:20px;padding:12px 10px;align-self:flex-start;min-width:74px}
.rn-h b{display:block;font-family:var(--f-titre);font-size:24px;font-weight:800;line-height:1}.rn-h span{display:block;font-size:11px;font-weight:700;margin-top:4px}
.rn-c{flex:1;min-width:0}.rn-c h3{font-size:20px;margin:6px 0 4px}.rn-c p{font-size:13.5px;color:#c9c8d0}
.rn-c .btn{background:rgba(255,255,255,.12);color:#fff}.rn-c .btn.or{background:var(--orange);color:var(--ink)}
.rn-ok{display:inline-flex;align-items:center;gap:4px;background:var(--vert);color:#fff;border-radius:99px;padding:3px 9px 3px 6px;font-family:var(--f);font-size:11.5px;font-weight:700;vertical-align:middle;letter-spacing:0}
.rn-ok .ic{width:13px;height:13px;stroke-width:2.5}
.resa-f{display:flex;align-items:center;gap:8px;background:#dff3ea;color:#0f5e3f;border-radius:18px;padding:12px 14px;font-weight:700;margin:12px 0}
</style>
<script id="lf" src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>

<div class="app">
  <main id="vues">
    <section class="vue" id="v-accueil"></section>
    <section class="vue" id="v-programme"></section>
    <section class="vue" id="v-carte">
      <div id="carte"><div class="c-attente">La carte se dessine…</div></div>
      <div class="c-puces"><div class="puces" id="c-puces"></div></div>
      <div id="apercu"></div>
      <button id="moi" class="moi" data-act="moi" aria-label="Me localiser sur la carte"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4L4 11l7 2 2 7z"/></svg></button>
    </section>
    <section class="vue" id="v-lieux"><div class="entete" id="l-tete"></div><div id="liste"></div></section>

const TRIP = {"fx":24.36,"aero":{"reco":{"t":"Bus 100 + métro B","time":"45 à 50 min","price":"50 Kč par personne","steps":["Sortez du terminal 2 (zone Schengen) et rejoignez le quai B.","Bus 100 direction Zličín : 17 min. En semaine, départs à :04, :19, :34 et :49.","À Zličín, métro B (ligne jaune) jusqu'au centre : Karlovo náměstí (Nouvelle Ville) ou Můstek (Vieille Ville), environ 20 min."],"why":"C'est le meilleur rapport temps / prix : un seul changement et un billet 90 min (50 Kč au terminal sans contact du bus, 46 Kč dans l'appli PID Lítačka)."},"opts":[{"t":"Trolleybus 59 + métro A puis B","time":"environ 50 min","price":"50 Kč","d":"Quai A, toutes les 5 min, 16 min jusqu'à Nádraží Veleslavín. Métro A jusqu'à Můstek, puis métro B sur deux stations. Deux changements."},{"t":"Uber (partenaire officiel de l'aéroport)","time":"26 à 32 min","price":"≈ 550 Kč, à vérifier","d":"Commandez dans l'appli, donnez le code PIN au chauffeur. Uber annonce 543 Kč en moyenne depuis l'aéroport. Le personnel Uber porte du rouge."},{"t":"Bolt","time":"26 à 32 min","price":"400 à 650 Kč, estimation","d":"Souvent un peu moins cher qu'Uber hors heures de pointe. Prix affiché avant la commande."},{"t":"Taxi au compteur","time":"26 à 32 min","price":"740 à 780 Kč au maximum légal","d":"Plafond légal depuis le 21 octobre 2026 : 70 Kč de prise en charge, 42 Kč par km, 7 Kč par minute. Trajet de 16,8 km."},{"t":"Airport Express (AE)","time":"","price":"200 Kč","d":"Inutile ici : il part du terminal 1, va à la gare centrale et n'accepte pas les billets PID."}],"scams":["Dans le hall, de faux agents « Info » en gilet jaune proposent des taxis à 1 800 Kč : refusez.","Ne montez jamais dans un taxi hélé devant le terminal sans prix affiché dans une appli.","Les bus 119 et le tram 14 cités par de vieux guides n'existent plus : c'est le bus 100 ou le trolleybus 59.","Police municipale : 156."]},"fares":[["30 min",39,36],["90 min",50,46],["24 h",150,140],["72 h",350,340]],"move":["Paiement sans contact dans chaque tram, bus et hall de métro (carte, Apple Pay, Google Pay). Les terminaux vendent les billets 30 min, 90 min et 24 h, pas le 72 h.","Un billet papier doit être composté à la première montée. Un billet d'appli n'est valable que 60 secondes après son activation.","Amende de 2 000 Kč sans titre valable (1 200 Kč payée sur place). Les contrôleurs sont en civil et montrent un badge.","Le billet 24 h (150 Kč) devient intéressant à partir de quatre trajets courts dans la journée.","Métro de 04:50 à minuit environ, pas de métro de nuit. La nuit, des trams de nuit prennent le relais.","Trams de jour à l'arrêt Moráň : 2, 3, 4, 10, 18, 21 et 24. Métro B à Karlovo náměstí, sortie E10.","L'appli PID Lítačka calcule les trajets en temps réel et vend les billets. Bagage gratuit jusqu'à 25 × 45 × 70 cm."],"moveLinks":[["Appli PID Lítačka","https://app.pidlitacka.cz/"],["Tarifs PID","https://pid.cz/en/new-pid-tariff-from-1-january-2026-dont-pay-more-than-you-have-to/"],["Perturbations trams","https://pid.cz/zmena/prehled-kratkodobych-omezeni-provozu-tramvaji-v-listopadu-2026-234068-9/"]],"money":["Cours de la banque nationale au 9 novembre 2026 : 1 € = 24,36 Kč. Retenez : 1 000 Kč ≈ 41 €, 100 Kč ≈ 4 €.","Les euros ? Quelques boutiques et restos touristiques les prennent en liquide, mais à un taux défavorable et ils rendent la monnaie en couronnes. Payez en Kč (par carte, c'est le plus simple) : sur ce site, chaque prix est aussi indiqué en euros.","La carte passe partout, même pour un café. Au terminal, choisissez toujours de payer en couronnes (CZK), jamais en euros.","Pour du liquide : distributeurs de banque (Česká spořitelna, Komerční banka, ČSOB, Raiffeisenbank à Karlovo náměstí). Évitez les Euronet bleus et jaunes.","Ne changez jamais d'argent dans la rue : on vous refile de vieux billets sans valeur. Un bureau agréé doit annuler l'opération dans les 3 heures si vous le demandez.","Pourboire : environ 10 % si le service était bon. On annonce le total voulu au moment de payer, on ne laisse pas de monnaie sur la table."],"tips":[{"c":"À table","items":["Les cuisines ferment tôt, vers 21:30 ou 22:00. Réservez et dînez avant.","Le midi en semaine, le « polední menu » offre un plat du jour pour 180 à 250 Kč.","Ce qu'on pose sur la table sans le demander (pain, bretzels, amuse-bouches) est facturé.","La bière se sert de trois façons : hladinka (classique), šnyt (moitié mousse), mlíko (toute en mousse, douce).","Le trdelník est une invention pour touristes. Goûtez plutôt les koláče, le větrník ou le věneček.","L'eau du robinet est excellente : demandez « kohoutková voda ».","Il est interdit de fumer à l'intérieur des bars et restaurants."]},{"c":"Saint-Martin","items":["Le 11 novembre à 11 h 11, on ouvre les premières bouteilles du vin de la Saint-Martin : jeune, léger, fruité.","Le plat de la semaine est l'oie rôtie, avec chou rouge et knedlíky. Beaucoup de restaurants la servent jusqu'au 15.","« Martin arrive sur un cheval blanc » : le dicton annonce la première neige autour du 11.","Les marchés de Noël ouvrent fin novembre et durent jusqu'aux Rois."]},{"c":"Bien voir la ville","items":["Il fait nuit dès 16:20. Gardez les extérieurs pour le matin, les musées et cafés pour la fin d'après-midi.","Le pont Charles se vit tôt le matin ou tard le soir, quand il est presque vide.","Les cours du Château sont gratuites : seuls les intérieurs demandent un billet.","Pickpockets dans le tram 22, sur le pont Charles et devant l'horloge : sac fermé, devant soi.","Les trams ont toujours la priorité, même sur les piétons. Sur les escalators, on se tient à droite.","Pavés glissants et gel dimanche : chaussures qui accrochent, gants, bonnet, plusieurs couches.","Dites « Dobrý den » en entrant dans une boutique ou un café : cela change l'accueil."]},{"c":"Pratique","items":["Prises de type E, comme en France. Itinérance européenne sans surcoût.","Pharmacie : « lékárna », croix verte. Les toilettes publiques sont souvent payantes (10 à 20 Kč).","Restauration tardive : Bageterie Boulevard, Jugoslávská 10, jusqu'à 01:00 (02:00 vendredi et samedi)."]}],"lex":[["Dobrý den","do-bri dèn","Bonjour"],["Ahoj","a-hoï","Salut"],["Děkuji","dié-kou-yi","Merci"],["Prosím","pro-sim","S'il vous plaît, de rien"],["Ano / Ne","a-no / nè","Oui / Non"],["Na shledanou","na-skhlè-da-no","Au revoir"],["Promiňte","pro-mine-tè","Pardon"],["Mluvíte anglicky?","mlou-vi-tè an-glits-ki","Parlez-vous anglais ?"],["Účet, prosím","ou-tchèt pro-sim","L'addition, s'il vous plaît"],["Platím kartou","pla-tim kar-to","Je paie par carte"],["Jedno pivo, prosím","yèd-no pi-vo","Une bière, s'il vous plaît"],["Dvě piva","dvié pi-va","Deux bières"],["Na zdraví!","na zdra-vi","Santé !"],["Dobrou chuť","do-bro khoutch","Bon appétit"],["Kde je…?","gdè yè","Où est… ?"],["Vchod / Východ","fkhod / vi-khod","Entrée / Sortie"],["Otevřeno / Zavřeno","o-tèv-jè-no / zav-jè-no","Ouvert / Fermé"],["Kohoutková voda","ko-hout-ko-va vo-da","Eau du robinet"],["Příští zastávka","prji-chti za-staf-ka","Prochain arrêt"],["Miluji tě","mi-lou-yi tié","Je t'aime"]],"urg":[["112","Urgences, numéro européen"],["155","Ambulance"],["158","Police nationale"],["156","Police municipale"],["150","Pompiers"]],"urgNote":"Ambassade de France (adresse à vérifier) : Velkopřevorské náměstí 2, Praha 1, sur l'île de Kampa.","spe":[{"cz":"Svatomartinská husa","fr":"L'oie de la Saint-Martin","saison":true,"ph":"_goose","d":"Autour du 11 novembre, fête de la Saint-Martin, toute la ville mange l'oie rôtie avec chou rouge et knedlíky. Souvent en quantité limitée, venez tôt.","p":"Cuisse d'oie confite 565–698 Kč","ids":["lokal","kuzelka","ukalendu","kotrba","kantyna","ukroka"]},{"cz":"Svatomartinské víno","fr":"Le vin nouveau","saison":true,"ph":"_wine2","d":"Le premier vin de l'année, débouché le 11.11 à 11 h 11 dans toute la ville. Léger et fruité, il se boit jeune, avec l'oie.","p":"Environ 95–99 Kč le verre","ids":["naplavka","kotrba","ukroka"]},{"cz":"Svíčková na smetaně","fr":"Bœuf à la crème","ph":"_tcheque","d":"Le plat national : bœuf mariné, sauce crémeuse aux légumes racines, knedlíky, airelles et une pointe de chantilly.","p":"390 Kč chez U Kroka","ids":["ukroka","havelska"]},{"cz":"Guláš","fr":"Goulash tchèque","ph":"3/3e/Plze%C5%88sk%C3%BD_gul%C3%A1%C5%A1_s_knedl%C3%ADky_a_plze%C5%88sk%C3%BDm_pivem_20240908_130703.jpg/500px-Plze%C5%88sk%C3%BD_gul%C3%A1%C5%A1_s_knedl%C3%ADky_a_plze%C5%88sk%C3%BDm_pivem_20240908_130703.jpg","d":"Plus épais que le hongrois, mijoté au paprika et servi avec des knedlíky pour saucer. Le plat de brasserie par excellence, avec une bière.","p":"325–360 Kč","ids":["pivovarsky","ukroka","havelska"]},{"cz":"Smažený sýr","fr":"Fromage pané frit","ph":"8/8c/Sma%C5%BEen%C3%BD_s%C3%BDr_s_dvojitou_porc%C3%AD_tatarky_v_restauraci_Metuje.jpg/500px-Sma%C5%BEen%C3%BD_s%C3%BDr_s_dvojitou_porc%C3%AD_tatarky_v_restauraci_Metuje.jpg","d":"Une épaisse tranche d'edam panée et frite, avec sauce tartare maison. Le plaisir coupable national, souvent cité comme excellent chez Lokál.","p":"Environ 200 Kč","ids":["lokal","kuzelka","kantyna"]},{"cz":"Řízek","fr":"Escalope panée","ph":"4/48/Kr%C3%A1li%C4%8D%C3%AD_%C5%99%C3%ADzek_a_bramborov%C3%BD_sal%C3%A1t_02.jpg/500px-Kr%C3%A1li%C4%8D%C3%AD_%C5%99%C3%ADzek_a_bramborov%C3%BD_sal%C3%A1t_02.jpg","d":"Escalope panée et salade de pommes de terre à la mayonnaise, la vraie. Le classique du dimanche.","p":"","ids":["lokal","kuzelka","havelska"]},{"cz":"Pečené koleno","fr":"Jarret de porc rôti","ph":"8/88/Pe%C4%8Den%C3%A9_vep%C5%99ov%C3%A9_koleno_z_konvektomatu_01.jpg/500px-Pe%C4%8Den%C3%A9_vep%C5%99ov%C3%A9_koleno_z_konvektomatu_01.jpg","d":"Un jarret entier rôti, peau croustillante, servi avec moutarde, raifort et pain. Ça se partage à deux.","p":"389 Kč chez U Fleků","ids":["ufleku","ukroka"]},{"cz":"Pivo","fr":"La bière tchèque","ph":"_beer2","d":"Les Tchèques sont les plus gros buveurs de bière au monde par habitant. Cherchez la Pilsner « de cuve » (tankové), non pasteurisée. La mousse épaisse est voulue.","p":"","ids":["lokal","tygr","pivovarsky","ufleku"]},{"cz":"Chlebíčky","fr":"Tartines garnies","ph":"2/29/Oblo%C5%BEen%C3%A9_chleb%C3%AD%C4%8Dky_on_a_plate.jpg/500px-Oblo%C5%BEen%C3%A9_chleb%C3%AD%C4%8Dky_on_a_plate.jpg","d":"Petites tartines ouvertes : jambon, salade de pommes de terre, œuf, cornichon. Le casse-croûte pragois, parfait sur le pouce.","p":"53–65 Kč la tartine","ids":["sisters","ovocny"]},{"cz":"Ovocné knedlíky","fr":"Knedlíky aux fruits","ph":"a/a5/T%C5%99i_ovocn%C3%A9_knedl%C3%ADky.JPG/500px-T%C5%99i_ovocn%C3%A9_knedl%C3%ADky.JPG","d":"Boulettes fourrées aux fruits, nappées de beurre fondu, de sucre et de fromage blanc. Sucré, mais servi comme un plat.","p":"59–138 Kč","ids":["knedlin","havelska"]},{"cz":"Koláče","fr":"Brioches garnies","ph":"2/2e/Tla%C4%8Den%C3%A9_kol%C3%A1%C4%8De_%28n%C3%A1pl%C5%88_-_bor%C5%AFvky%2C_meru%C5%88ky_a_dom%C3%A1c%C3%AD_marmel%C3%A1da%29_05.jpg/500px-Tla%C4%8Den%C3%A9_kol%C3%A1%C4%8De_%28n%C3%A1pl%C5%88_-_bor%C5%AFvky%2C_meru%C5%88ky_a_dom%C3%A1c%C3%AD_marmel%C3%A1da%29_05.jpg","d":"Petites brioches rondes garnies de pavot, de fromage frais ou de prune. Le goûter tchèque, bien meilleur que le trdelník.","p":"65–80 Kč pièce","ids":["kolacherie","kuskolace"]},{"cz":"Kremrole & věnečky","fr":"Pâtisseries d'antan","ph":"7/7c/Kremrole_01.jpg/500px-Kremrole_01.jpg","d":"Les douceurs de la Première République : cornets feuilletés garnis de meringue, couronnes de pâte à choux à la crème.","p":"","ids":["mysak","erhart"]}],"speNote":"Le trdelník, ce cylindre de pâte vendu à chaque coin de rue, est une invention récente pour touristes : sympa, mais pas une spécialité tchèque.","days":[{"d":11,"lab":"Jour","title":"Premiers pas, Nouvelle Ville et pont Charles","steps":[{"h":"12:45","t":"Déjeuner tout près","x":"Grand café historique, bistrot au bord de l'eau, ou une pâtisserie pour patienter.","ids":["louvre","ukalendu","artic"]},{"h":"14:30","t":"Le pont Charles au crépuscule","x":"Le plus beau moment : quand les lumières s'allument, vers 16h30 en hiver.","ids":["most","vez"]},{"h":"22:00","t":"Premier cocktail","x":"Pensez à réserver au moins 2 h avant.","ids":["hemingway"]}]},{"d":12,"lab":"Jour","title":"Le Château et Malá Strana","steps":[{"h":"08:30","t":"Tram vers le Château","x":"Tram 22 (à vérifier dans l'appli PID Lítačka), arrêt Pražský hrad."},{"h":"09:00","t":"Château de Prague","x":"Cathédrale Saint-Guy, vieux palais royal, ruelle d'Or. Relève de la garde à 12:00. Les cours sont gratuites.","ids":["hrad"]},{"h":"12:30","t":"Déjeuner sur la colline","x":"Cuisine tchèque avec vue, ou la brasserie du monastère.","ids":["kuchyn","strahov-pivo"]},{"h":"14:00","t":"Bibliothèques de Strahov et Lorette","x":"Les deux plus belles salles baroques de la ville, à l'abri.","ids":["strahov","loreta"]},{"h":"15:30","t":"Descente vers Malá Strana","x":"Saint-Nicolas, l'île de Kampa, le mur Lennon.","ids":["mikulas","kampa","lennon"]},{"h":"16:45","t":"Goûter","x":"Glace ou chocolat chaud à la villa Werich, ou pâtisseries au Café Savoy.","ids":["werich","savoy"]},{"h":"20:00","t":"Dîner au Ginger & Fred","x":"Au 7ᵉ étage de la Maison dansante, vue sur la Vltava et le Château illuminé. Menu dégustation 5 plats avec coupe de bienvenue : 1 990 Kč par personne. Réservez, et demandez une table côté fenêtre.","ids":["gingerfred"]},{"h":"22:30","t":"Dernier verre sur le toit","x":"Le Glass Bar est juste au-dessus, au sommet du même bâtiment.","ids":["glassbar","hemingway"]}]},{"d":13,"lab":"Jour","title":"Vieille Ville, Josefov, Art nouveau","steps":[{"h":"09:00","t":"Horloge astronomique","x":"Montée à la tour à moitié prix entre 9 h et 10 h. Défilé des apôtres à chaque heure pleine.","ids":["orloj"]},{"h":"10:15","t":"Quartier juif","x":"Synagogues et vieux cimetière avec un billet unique.","ids":["josefov"]},{"h":"12:30","t":"Déjeuner sur le pouce","x":"Boucherie-comptoir, tartines tchèques ou brasserie de tank.","ids":["nasemaso","sisters","lokal"]},{"h":"13:30","t":"Maison munici     else if (a === "vlieu") { fermeVisio(); ouvre(id); }
    else if (a === "suppr") { b.dataset.act = "suppr2"; b.innerHTML = ic("corbeille") + " Confirmer la suppression"; b.style.borderColor = b.style.color = "var(--grenat)"; }
    else if (a === "suppr2") { const k = visioId; SOUV = SOUV.filter(s => s.id !== k); Promise.all([dbDel("meta", k), dbDel("full", k)]).then(() => { fermeVisio(); apres(); toast("Photo supprimée"); }); }
  });
  $("#fichier").addEventListener("change", e => { const f = Array.from(e.target.files || []); if (f.length) recoit(f); });
  document.addEventListener("input", e => {
    if (e.target.id === "q") { F.q = e.target.value; renduListe(); }
    const c = e.target.dataset && e.target.dataset.conv; if (!c) return;
    const n = v => parseFloat(String(v).replace(/\s/g, "").replace(",", ".")) || 0, f = v => (Math.round(v * 100) / 100).toString().replace(".", ",");
    if (c === "kc") $("#euA").value = f(n(e.target.value) / FX); else $("#kcA").value = f(Math.round(n(e.target.value) * FX));
  });
  document.addEventListener("change", e => { if (e.target.id === "legende" && visioId) { const s = SOUV.find(x => x.id === visioId); if (s) { s.cap = e.target.value.trim(); dbPut("meta", s).then(apres); } } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") {  if (visioId) fermeVisio(); else ferme(); } });
  setInterval(() => { if (onglet === "accueil") majEtat(); }, 30000);
  /* ---------- Prix en euros : chaque montant en Kč affiché devient « ≈ X € (N Kč) » ---------- */
  const NB = "(\\d{1,3}(?:[   ]\\d{3})+|\\d+)";
  const RX_KC = new RegExp("(?<![\\d,.])" + NB + "(?:(\\s*(?:–|-|à|/|ou)\\s*)" + NB + ")?[   ]?(Kč|CZK)(?!\\s*\\(?≈)", "g");
  const enEur = n => { const v = parseInt(n.replace(/\D/g, ""), 10) / FX; return v < 10 ? v.toFixed(1).replace(".", ",").replace(",0", "") : String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); };
  function euros(racine) {
    const w = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT, { acceptNode: t => /K[čc]|CZK/.test(t.nodeValue) && !t.parentElement.closest("script,style,input,textarea,#geo,.conv,.no-eur") ? 1 : 2 });
    const l = []; while (w.nextNode()) l.push(w.currentNode);
    l.forEach(t => { const v = t.nodeValue.replace(RX_KC, (m, a, sep, b, u, i, all) => { if (/€\s\($/.test(all.slice(Math.max(0, i - 3), i))) return m; const sp = !b ? "" : /\//.test(sep) ? " / " : /ou/.test(sep) ? " ou " : "–", env = /(≈|environ|dès|à partir de|moins de|plus de)\s*$/i.test(all.slice(0, i)); return (env ? "" : "≈\u00a0") + enEur(a) + (b ? sp + enEur(b) : "") + "\u00a0€ (" + m.trim() + ")"; }); if (v !== t.nodeValue) t.nodeValue = v; });
  }
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) euros(n); else if (n.nodeType === 3 && n.parentElement) euros(n.parentElement); }))).observe(document.body, { childList: true, subtree: true });

  renduAccueil(); renduTete(); renduPratique();
  montre(location.hash.slice(1) || "accueil");
  ouvreDB().then(() => { if (onglet === "souvenirs") renduSouvenirs(); majEtat(); });
})();
</script>
